<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>♄</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <canvas id="starfield"></canvas>

  <!-- Void / Home -->
  <div id="void" class="void-screen visible">
    <button class="void-content" onclick="exitVoid()" aria-label="Enter">
      <span class="void-symbol">♄</span>
      <span class="void-msg">Nothing much to find here for now... move along.</span>
    </button>
  </div>

  <!-- Black hole -->
  <main id="hole" class="hole">
    <figure class="hole-figure">
      <img id="bh" src="./luminet-1979.jpg" alt="First simulated image of a black hole, Jean-Pierre Luminet, 1979" onclick="nextFact()">
      <figcaption>J.-P. Luminet · 1979 · first image of a black hole</figcaption>
    </figure>

    <p id="output" class="fact" aria-live="polite"></p>

    <nav class="hole-nav">
      <button onclick="nextFact()">more</button>
      <button class="back" onclick="enterVoid()" aria-label="Back">♄</button>
    </nav>
  </main>

  <footer class="credit">
    Image: Jean-Pierre Luminet, <i>A&amp;A</i> 75, 228 (1979) — <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>
  </footer>

  <script>
    /* ── Starfield ── */
    const sfC = document.getElementById('starfield');
    const sfX = sfC.getContext('2d');
    let stars = [];

    function resizeSF() { sfC.width = innerWidth; sfC.height = innerHeight; }
    function initStars() {
      stars = Array.from({ length: 180 }, () => ({
        x: Math.random() * sfC.width,
        y: Math.random() * sfC.height,
        r: Math.random() * 1 + 0.15,
        spd: Math.random() * 0.004 + 0.001,
        ph: Math.random() * Math.PI * 2,
      }));
    }
    function drawStars(t) {
      sfX.clearRect(0, 0, sfC.width, sfC.height);
      for (const s of stars) {
        const a = 0.15 + 0.5 * (0.5 + 0.5 * Math.sin(t * s.spd + s.ph));
        sfX.beginPath();
        sfX.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        sfX.fillStyle = `rgba(220,225,235,${a})`;
        sfX.fill();
      }
      requestAnimationFrame(drawStars);
    }
    resizeSF(); initStars(); requestAnimationFrame(drawStars);
    window.addEventListener('resize', () => { resizeSF(); initStars(); });

    /* ── Facts ── */
    const facts = [
      "This image was computed in 1979 on an IBM 7040 fed with punched cards, then drawn by hand, dot by dot, in ink on photographic paper.",
      "The left side of the disk looks brighter because its gas is rushing towards us. The right side is moving away.",
      "The arc above the shadow is the far side of the disk, its light bent up and over the black hole by gravity.",
      "Forty years later, in April 2019, the Event Horizon Telescope released the first real image of a black hole: M87*.",
      "M87* weighs about 6.5 billion Suns and lies 55 million light-years away.",
      "TON 618 is one of the most massive black holes ever measured: about 66 billion times the mass of the Sun.",
      "The event horizon of TON 618 is so wide that our whole Solar System, out to Neptune, would fit inside it dozens of times over.",
      "TON 618 was first catalogued in 1957 as a faint blue star. It is in fact a quasar shining like 140 trillion Suns.",
      "The light we receive from TON 618 left it about 10.8 billion years ago, long before the Earth existed.",
      "At the centre of our galaxy sits Sagittarius A*, a black hole of about 4 million solar masses, 26,000 light-years from us.",
      "If the Sun became a black hole, its event horizon would have a radius of only about 3 km.",
      "Squeeze the Earth into a black hole and it would be about the size of a marble.",
      "Seen from afar, anything falling in seems to slow down, redden and freeze at the edge. It never quite crosses.",
      "Near a black hole, time runs slower than it does far away.",
      "At 1.5 times the horizon radius, light itself can orbit the black hole.",
      "The biggest black holes are, on average, less dense than water.",
      "Black holes slowly evaporate. One with the mass of the Sun would take about 10⁶⁷ years to disappear.",
      "In 1783, John Michell imagined 'dark stars' whose gravity would be too strong for light to escape.",
      "The name 'black hole' was popularised by physicist John Wheeler in 1967.",
      "In 2015, LIGO detected the gravitational waves of two black holes merging 1.3 billion years ago.",
      "Falling into a small black hole, you would be stretched like spaghetti. Physicists actually call it spaghettification."
    ];

    let order = [], idx = 0, typing = null;
    function shuffle() {
      order = facts.map((_, i) => i).sort(() => Math.random() - 0.5);
      idx = 0;
    }

    function typeText(el, text, speed = 26) {
      clearTimeout(typing);
      let i = 0;
      (function tick() {
        el.innerHTML = text.substring(0, i) + '<span class="cursor"></span>';
        if (i++ < text.length) typing = setTimeout(tick, speed);
      })();
    }

    function nextFact() {
      if (idx >= order.length) shuffle();
      typeText(document.getElementById('output'), facts[order[idx++]]);
    }

    /* ── Transitions ── */
    const voidEl = document.getElementById('void');
    const hole = document.getElementById('hole');

    function exitVoid() {
      voidEl.classList.remove('visible');
      document.body.classList.add('inside');
      setTimeout(() => {
        hole.classList.add('visible');
        nextFact();
      }, 900);
    }

    function enterVoid() {
      hole.classList.remove('visible');
      document.body.classList.remove('inside');
      setTimeout(() => voidEl.classList.add('visible'), 900);
    }

    shuffle();
  </script>
</body>
</html>
